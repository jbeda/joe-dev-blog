name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to commit back .sequoia-state.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history for Hugo .GitInfo / lastmod

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      - uses: oven-sh/setup-bun@v2

      - name: Publish to ATproto
        run: bunx sequoia-cli publish
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}

      - name: Commit updated Sequoia state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update sequoia publish state [skip ci]"
          file_pattern: .sequoia-state.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: joe-dev-blog
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
