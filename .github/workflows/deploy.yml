name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write  # needed to commit back sequoia state + frontmatter

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0  # full history for Hugo .GitInfo / lastmod

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3.2.1
        with:
          hugo-version: '0.161.1'
          extended: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      # 1. Publish source posts to ATproto.
      #    Writes atUri into each post's frontmatter and updates state file.
      - name: Publish to ATproto
        run: bunx sequoia-cli publish
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}

      # 2. Commit frontmatter updates + state before building.
      #    Keeps the tracked working tree clean for Wrangler's git check.
      - name: Commit sequoia state and frontmatter updates
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9  # v7.1.0
        with:
          commit_message: "chore: update sequoia publish state [skip ci]"
          file_pattern: .sequoia-state.json content/posts/*.md

      # 3. Build from the now-committed source (atUri values present in frontmatter).
      - name: Build
        run: hugo --minify

      # 4. Inject <link rel="site.standard.document"> tags into built HTML.
      #    Reads state for slug→atUri mappings, writes into public/*.html.
      #    public/ is gitignored so this doesn't dirty the working tree.
      - name: Inject ATproto link tags
        run: bunx sequoia-cli inject

      # 5. Deploy the fully-built, injected output.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=joe-dev-blog --commit-dirty=true
