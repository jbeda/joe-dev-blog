baseURL = 'https://joe.dev/'
locale = 'en-us'
title = "Joe's Development Blog"
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true

[params]
  author = 'Joe Beda'
  description = "Joe Beda talking computer stuff"
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  ShowToc = true
  TocOpen = false

  # standard.site / ATproto publication URI — set this to your own publication URI.
  # Used by extend_head.html to emit the <link rel="site.standard.publication"> tag
  # required for Bluesky enhanced link cards.
  standardSitePublicationURI = "at://did:plc:vkn2vmcnsmlffrpwalvgybw5/site.standard.publication/3mmfe3yxkqd2b"

[params.homeInfoParams]
  Title = "Hi, I'm Joe"
  Content = "Engineer and serial builder — from Internet Explorer to Google Compute Engine to Kubernetes to now. CTO at [Stacklok](https://stacklok.com). This is where I write things that don't fit in a pull request."

[[params.socialIcons]]
  name = 'bluesky'
  url = 'https://bsky.app/profile/h.olysh.it'

[[params.socialIcons]]
  name = 'linkedin'
  url = 'https://www.linkedin.com/in/jbeda/'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/jbeda'

[[menu.main]]
  name = 'About'
  url = '/about/'
  weight = 10

[[menu.main]]
  name = 'Archives'
  url = '/archives/'
  weight = 20

[[menu.main]]
  name = 'Search'
  url = '/search/'
  weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.highlight]
  noClasses = false
