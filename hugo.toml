baseURL = 'https://joe.dev/'
languageCode = 'en-US'
title = "joe.dev"
theme = 'PaperMod'
paginate = 10
enableRobotsTXT = true

[params]
  author = 'Joe Beda'
  description = "Joe Beda talking computer stuff"
  images = ['/og-home.png']  # default OG image for pages without a cover
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShareButtons = ['bluesky', 'x', 'linkedin', 'reddit', 'email']
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  ShowToc = true
  TocOpen = false

  # standard.site / ATproto publication URI — set this to your own publication URI.
  # Used by extend_head.html to emit the <link rel="site.standard.publication"> tag
  # required for Bluesky enhanced link cards.
  standardSitePublicationURI = "at://did:plc:vkn2vmcnsmlffrpwalvgybw5/site.standard.publication/3mmfe3yxkqd2b"

[params.label]
  icon = "/apple-touch-icon.png"
  iconHeight = 28

[params.homeInfoParams]
  Title = "Hi, I'm Joe"
  Content = "Joe Beda's development blog. Engineer and serial builder — from Internet Explorer to Google Compute Engine to Kubernetes to now. CTO at [Stacklok](https://stacklok.com). This is where I write things that don't fit in a pull request."

