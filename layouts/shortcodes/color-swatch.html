{{- /* One row of the colophon color table. Use inside {{< color-table >}}. */ -}}
<tr>
  <th scope="row" class="color-table__role">{{ .Get "role" }}</th>
  <td>{{ partial "color-chip.html" (dict "color" (.Get "light")) }}</td>
  <td>{{ partial "color-chip.html" (dict "color" (.Get "dark")) }}</td>
</tr>
