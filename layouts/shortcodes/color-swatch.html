<div style="display:grid;grid-template-columns:3.5rem 1fr 8.5rem 10rem;align-items:center;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.9rem;gap:0.5rem;">
  <div style="display:flex;gap:0.3rem;">
    <span title="Light: {{ .Get "light" }}" style="display:inline-block;width:1.25rem;height:1.25rem;background:{{ .Get "light" | safeCSS }};border:1px solid var(--border);border-radius:3px;"></span>
    <span title="Dark: {{ .Get "dark" }}" style="display:inline-block;width:1.25rem;height:1.25rem;background:{{ .Get "dark" | safeCSS }};border:1px solid var(--border);border-radius:3px;"></span>
  </div>
  <div>{{ .Get "role" }}</div>
  <code style="color:var(--secondary);">{{ .Get "light" }}</code>
  <code style="color:var(--secondary);">{{ .Get "dark" }}</code>
</div>
