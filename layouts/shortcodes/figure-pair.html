<div style="display:flex;gap:1.5rem;align-items:stretch;margin:1.5rem 0;">
  <figure style="flex:1;margin:0;display:flex;flex-direction:column;align-items:center;">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
      <img src="{{ .Get "src1" }}" alt="{{ .Get "cap1" }}" style="max-width:100%;max-height:280px;object-fit:contain;">
    </div>
    <figcaption style="font-size:0.85em;margin-top:0.4rem;text-align:center;">{{ .Get "cap1" }}</figcaption>
  </figure>
  <figure style="flex:1;margin:0;display:flex;flex-direction:column;align-items:center;">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;">
      <img src="{{ .Get "src2" }}" alt="{{ .Get "cap2" }}" style="max-width:100%;max-height:280px;object-fit:contain;">
    </div>
    <figcaption style="font-size:0.85em;margin-top:0.4rem;text-align:center;">{{ .Get "cap2" }}</figcaption>
  </figure>
</div>
