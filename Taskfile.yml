version: '3'

dotenv: ['.env']

vars:
  DEV_PORT: "1313"
  PY: scripts/.venv/bin/python3

tasks:

  dev:
    desc: "Start Hugo dev server on port {{.DEV_PORT}} with drafts (kills any existing instance first)"
    cmds:
      - task: dev:stop
      # Binds to 0.0.0.0 so the Playwright MCP server (runs in a Docker container via ToolHive)
      # can reach it via http://host.docker.internal:1313. Use a firewall if on an untrusted LAN.
      - hugo server -D --port {{.DEV_PORT}} --bind 0.0.0.0

  dev:stop:
    desc: Stop any running Hugo dev server
    cmds:
      - pkill -f "hugo server" || true

  dev:restart:
    desc: Restart the Hugo dev server
    cmds:
      - task: dev

  build:
    desc: Production build (minified output → public/)
    cmds:
      - hugo --minify

  preview:
    desc: Build then serve the production output locally
    cmds:
      - task: dev:stop
      - hugo --minify
      - hugo server --renderStaticToDisk --port {{.DEV_PORT}}

  clean:
    desc: Remove Hugo build output and cache
    cmds:
      - rm -rf public resources/_gen .hugo_build.lock

  scripts:setup:
    desc: Create Python venv under scripts/.venv (Python 3.13) and install dependencies
    cmds:
      - uv venv --python 3.13 scripts/.venv
      - uv pip install --python scripts/.venv/bin/python3 -r scripts/requirements.txt
    sources:
      - scripts/requirements.txt
    generates:
      - scripts/.venv/pyvenv.cfg

  fonts:
    desc: Download brand fonts and generate static Nunito weight instances
    deps: [scripts:setup]
    vars:
      BASE: https://github.com/google/fonts/raw/main/ofl
    cmds:
      - mkdir -p fonts
      - |
        download() {
          local url="$1" dest="fonts/$2"
          if [[ -f "$dest" ]]; then
            echo "  exists:      $2"
          else
            echo "  downloading: $2"
            curl -fsSL "$url" -o "$dest"
          fi
        }
        echo "==> Cormorant (variable)"
        download "{{.BASE}}/cormorant/Cormorant%5Bwght%5D.ttf"        "Cormorant-variable.ttf"
        download "{{.BASE}}/cormorant/Cormorant-Italic%5Bwght%5D.ttf" "Cormorant-Italic-variable.ttf"
        echo "==> Nunito (variable)"
        download "{{.BASE}}/nunito/Nunito%5Bwght%5D.ttf"              "Nunito-variable.ttf"
        download "{{.BASE}}/nunito/Nunito-Italic%5Bwght%5D.ttf"       "Nunito-Italic-variable.ttf"
        echo "==> Space Mono (static)"
        download "{{.BASE}}/spacemono/SpaceMono-Regular.ttf"          "SpaceMono-Regular.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-Bold.ttf"             "SpaceMono-Bold.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-Italic.ttf"           "SpaceMono-Italic.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-BoldItalic.ttf"       "SpaceMono-BoldItalic.ttf"
      - |
        # Nunito-variable.ttf defaults to wght=200 (ExtraLight); Pillow cannot select variable
        # font axes, so we generate discrete static instances via fonttools for the weights we use.
        echo "==> Nunito (static instances via fonttools)"
        {{.PY}} - <<'EOF'
        from pathlib import Path
        from fontTools.varLib import instancer
        from fontTools.ttLib import TTFont

        weights = {"Light": 300, "Regular": 400, "SemiBold": 600}
        for name, wght in weights.items():
            out = Path(f"fonts/Nunito-{name}.ttf")
            if out.exists():
                print(f"  exists:      Nunito-{name}.ttf")
            else:
                print(f"  generating:  Nunito-{name}.ttf")
                font = instancer.instantiateVariableFont(
                    TTFont("fonts/Nunito-variable.ttf"), {"wght": wght}
                )
                font.save(str(out))
        print("Done.")
        EOF

  og-home:
    desc: Generate the home page OG image (static/og-home.png)
    deps: [fonts]
    cmds:
      - "{{.PY}} scripts/generate-og-home.py"

  cover:
    desc: "Generate cover image for a post (reads title from frontmatter). Usage: task cover POST=content/posts/my-post.md"
    deps: [fonts]
    cmds:
      - "{{.PY}} scripts/generate-cover.py --post {{.POST}}"
    requires:
      vars: [POST]

  covers-regen:
    desc: Regenerate all cover images from their sidecars (use after branding changes)
    deps: [fonts]
    cmds:
      - "{{.PY}} scripts/generate-cover.py --regen-all"

  atproto-check:
    desc: List orphaned ATproto records not tracked by Sequoia (dry run)
    deps: [scripts:setup]
    cmds:
      - "{{.PY}} scripts/delete-orphaned-records.py"

  atproto-cleanup:
    desc: Delete orphaned ATproto records not tracked by Sequoia
    prompt: This will permanently delete records from your PDS. Continue?
    deps: [scripts:setup]
    cmds:
      - "{{.PY}} scripts/delete-orphaned-records.py --delete"

  publication-icon:
    desc: "Upload a PNG as the publication icon blob (default: static/apple-touch-icon.png)"
    deps: [scripts:setup]
    cmds:
      - "{{.PY}} scripts/set-publication-icon.py {{.CLI_ARGS}}"
