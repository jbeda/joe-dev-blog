version: '3'

dotenv: ['.env']

vars:
  DEV_PORT: "1313"
  # Newest nvm-managed node bin dir (not version-pinned). Task ignores a
  # top-level `env: PATH:`, so NODE/NPM prepend it to PATH themselves — this is
  # what lets npm's `#!/usr/bin/env node` shebang and any node-spawned children
  # resolve in Task's non-interactive shell.
  NODE_BIN:
    sh: ls -td "$HOME"/.nvm/versions/node/*/bin 2>/dev/null | head -1
  NODE: 'PATH="{{.NODE_BIN}}:$PATH" node'
  NPM: 'PATH="{{.NODE_BIN}}:$PATH" npm'

tasks:

  dev:
    desc: "Start Hugo dev server on port {{.DEV_PORT}} with drafts + future posts (kills any existing instance first)"
    cmds:
      - task: dev:stop
      # Binds to 0.0.0.0 so the Playwright MCP server (runs in a Docker container via ToolHive)
      # can reach it via http://host.docker.internal:1313. Use a firewall if on an untrusted LAN.
      # -D shows draft posts; -F shows future-dated posts (needed when previewing before publish date).
      - hugo server -D -F --port {{.DEV_PORT}} --bind 0.0.0.0

  dev:stop:
    desc: Stop any running Hugo dev server
    cmds:
      - pkill -f "hugo server" || true

  dev:restart:
    desc: Restart the Hugo dev server
    cmds:
      - task: dev

  build:
    desc: Production build (minified output → public/)
    cmds:
      - hugo --minify

  preview:
    desc: Build then serve the production output locally
    cmds:
      - task: dev:stop
      - hugo --minify
      - hugo server --renderStaticToDisk --port {{.DEV_PORT}}

  clean:
    desc: Remove Hugo build output and cache
    cmds:
      - rm -rf public resources/_gen .hugo_build.lock

  fonts:
    desc: Download brand fonts and generate static Nunito weight instances
    vars:
      BASE: https://github.com/google/fonts/raw/main/ofl
    cmds:
      - mkdir -p fonts
      - |
        download() {
          local url="$1" dest="fonts/$2"
          if [[ -f "$dest" ]]; then
            echo "  exists:      $2"
          else
            echo "  downloading: $2"
            curl -fsSL "$url" -o "$dest"
          fi
        }
        echo "==> Cormorant (variable)"
        download "{{.BASE}}/cormorant/Cormorant%5Bwght%5D.ttf"        "Cormorant-variable.ttf"
        download "{{.BASE}}/cormorant/Cormorant-Italic%5Bwght%5D.ttf" "Cormorant-Italic-variable.ttf"
        echo "==> Nunito (variable)"
        download "{{.BASE}}/nunito/Nunito%5Bwght%5D.ttf"              "Nunito-variable.ttf"
        download "{{.BASE}}/nunito/Nunito-Italic%5Bwght%5D.ttf"       "Nunito-Italic-variable.ttf"
        echo "==> Space Mono (static)"
        download "{{.BASE}}/spacemono/SpaceMono-Regular.ttf"          "SpaceMono-Regular.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-Bold.ttf"             "SpaceMono-Bold.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-Italic.ttf"           "SpaceMono-Italic.ttf"
        download "{{.BASE}}/spacemono/SpaceMono-BoldItalic.ttf"       "SpaceMono-BoldItalic.ttf"
      - |
        # Variable fonts default to a weight that may not match what we need.
        # Satori crashes on variable TTFs so we extract discrete static instances.
        echo "==> Static instances via fonttools (Cormorant + Nunito)"
        uv run --with-requirements scripts/requirements.txt --no-project python - <<'EOF'
        from pathlib import Path
        from fontTools.varLib import instancer
        from fontTools.ttLib import TTFont

        instances = [
            ("fonts/Cormorant-variable.ttf", {"wght": 300}, "fonts/Cormorant-Light.ttf"),
            ("fonts/Cormorant-variable.ttf", {"wght": 600}, "fonts/Cormorant-SemiBold.ttf"),
            ("fonts/Nunito-variable.ttf",    {"wght": 300}, "fonts/Nunito-Light.ttf"),
            ("fonts/Nunito-variable.ttf",    {"wght": 400}, "fonts/Nunito-Regular.ttf"),
            ("fonts/Nunito-variable.ttf",    {"wght": 600}, "fonts/Nunito-SemiBold.ttf"),
        ]
        for src, axes, dest in instances:
            out = Path(dest)
            if out.exists():
                print(f"  exists:      {out.name}")
            else:
                print(f"  generating:  {out.name}")
                font = instancer.instantiateVariableFont(TTFont(src), axes)
                font.save(str(out))
        print("Done.")
        EOF

  graphics-gen:setup:
    desc: Install Node.js dependencies for graphics-gen
    sources:
      - graphics-gen/package.json
    generates:
      - graphics-gen/node_modules/.package-lock.json
    cmds:
      - "{{.NPM}} install"
    dir: graphics-gen

  og-home:
    desc: Generate the home page OG image (static/og-home.png)
    deps: [fonts, graphics-gen:setup]
    cmds:
      - "{{.NODE}} graphics-gen/src/og-home.mjs"

  cover:
    desc: "Generate cover image for a post (reads title from frontmatter). Usage: task cover POST=content/posts/my-post.md"
    deps: [fonts, graphics-gen:setup]
    cmds:
      - "{{.NODE}} graphics-gen/src/cover.mjs --post {{.POST}}"
    requires:
      vars: [POST]

  covers-regen:
    desc: Regenerate all cover images from their sidecars (use after branding changes)
    deps: [fonts, graphics-gen:setup]
    cmds:
      - "{{.NODE}} graphics-gen/src/cover.mjs --regen-all"

  favicon:
    desc: Regenerate all favicon PNGs and rebuild favicon.ico
    deps: [fonts, graphics-gen:setup]
    cmds:
      - "{{.NODE}} graphics-gen/src/favicon.mjs"
      - magick static/favicon-16x16.png static/favicon-32x32.png static/favicon.ico
      - echo "✓ favicon.ico rebuilt"

  atproto-check:
    desc: List orphaned ATproto records not tracked by Sequoia (dry run)
    cmds:
      - "uv run --no-project python scripts/delete-orphaned-records.py"

  atproto-cleanup:
    desc: Delete orphaned ATproto records not tracked by Sequoia
    prompt: This will permanently delete records from your PDS. Continue?
    cmds:
      - "uv run --no-project python scripts/delete-orphaned-records.py --delete"

  publication-icon:
    desc: "Upload a PNG as the publication icon blob (default: static/apple-touch-icon.png)"
    cmds:
      - "uv run --no-project python scripts/set-publication-icon.py {{.CLI_ARGS}}"
